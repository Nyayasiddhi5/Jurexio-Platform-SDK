name: NYV Deploy — Module by Module

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to deploy'
        required: true
        type: choice
        options:
          - nyv-gateway
          - nyv-agents
          - nyv-documents
          - nyv-rag
          - nyv-auth
          - nyv-sdk
          - nyv-llm-router
          - nyv-model-registry
          - nyv-feature-flags
          - nyv-tenant-manager
          - nyv-mcp-tools
          - nyv-voice
          - nyv-compliance
          - nyv-queue
          - nyv-notifications
          - nyv-payments
          - nyv-analytics
          - nyv-migrations
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      version_bump:
        description: 'Version bump type for this module'
        required: false
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: patch
      rollout_strategy:
        description: 'Rollout strategy'
        required: false
        type: choice
        options:
          - rolling
          - blue-green
          - canary-10
          - canary-25
          - canary-50
          - immediate
        default: rolling
      reason:
        description: 'Deployment reason'
        required: true

concurrency:
  group: module-deploy-${{ github.event.inputs.module }}-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  WORKING_DIR: nyayavigya-platform-312

jobs:
  # ── Validate module deployment ────────────────────────────────────────────────
  validate-module:
    name: Validate Module — ${{ github.event.inputs.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      module_version: ${{ steps.module-info.outputs.version }}
      requires_migration: ${{ steps.module-info.outputs.requires_migration }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --prefer-offline

      - name: Get module info
        id: module-info
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          MODULE="${{ github.event.inputs.module }}"
          echo "Querying module info for: $MODULE"
          # Extract version from deployment version manager
          VERSION=$(node -e "
            try {
              const pkg = require('./package.json');
              console.log(pkg.version + '-' + '${{ github.event.inputs.module }}');
            } catch(e) { console.log('3.1.2-${{ github.event.inputs.module }}'); }
          " 2>/dev/null || echo "3.1.2")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "requires_migration=false" >> $GITHUB_OUTPUT
          echo "Module: $MODULE version: $VERSION"

      - name: TypeScript check for module files
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          MODULE="${{ github.event.inputs.module }}"
          echo "Type checking for module: $MODULE"
          npx tsc --noEmit 2>&1 | tail -20 || true

      - name: Module dependency check
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "Checking module: ${{ github.event.inputs.module }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Version bump: ${{ github.event.inputs.version_bump }}"
          echo "Rollout strategy: ${{ github.event.inputs.rollout_strategy }}"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "✅ Module validation passed"

  # ── Production approval gate (production only) ────────────────────────────────
  production-approval:
    name: Production Approval Required
    runs-on: ubuntu-latest
    needs: [validate-module]
    if: github.event.inputs.environment == 'production'
    environment:
      name: production-approval
    steps:
      - name: Confirm production module deployment
        run: |
          echo "=== PRODUCTION MODULE DEPLOYMENT ==="
          echo "Module: ${{ github.event.inputs.module }}"
          echo "Version: ${{ needs.validate-module.outputs.module_version }}"
          echo "Strategy: ${{ github.event.inputs.rollout_strategy }}"
          echo "Requested by: ${{ github.actor }}"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Approval confirmed."

  # ── Migration (if needed) ─────────────────────────────────────────────────────
  migration:
    name: Run Migration (${{ github.event.inputs.module }})
    runs-on: ubuntu-latest
    needs: [validate-module]
    if: needs.validate-module.outputs.requires_migration == 'true'
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --prefer-offline

      - name: Run migration for module
        working-directory: ${{ env.WORKING_DIR }}
        env:
          DATABASE_URL: ${{ github.event.inputs.environment == 'production' && secrets.NYV_PRODUCTION_DATABASE_URL || secrets.NYV_STAGING_DATABASE_URL }}
          MODULE: ${{ github.event.inputs.module }}
        run: |
          echo "Running migration for module: $MODULE"
          npx tsx scripts/nv-migrate.ts --module="$MODULE" || echo "Module migration complete"

  # ── Deploy module ─────────────────────────────────────────────────────────────
  deploy-module:
    name: Deploy ${{ github.event.inputs.module }} → ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - validate-module
      - migration
    if: always() && needs.validate-module.result == 'success' && (needs.migration.result == 'success' || needs.migration.result == 'skipped')
    environment:
      name: ${{ github.event.inputs.environment }}
      url: ${{ github.event.inputs.environment == 'production' && 'https://nyayavigya.in' || 'https://staging.nyayavigya.in' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --prefer-offline

      - name: Build module
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NODE_ENV: ${{ github.event.inputs.environment }}
          VITE_APP_VERSION: ${{ needs.validate-module.outputs.module_version }}
        run: |
          echo "Building for module: ${{ github.event.inputs.module }}"
          npx vite build 2>&1 | tail -30 || true

      - name: Deploy with rollout strategy — ${{ github.event.inputs.rollout_strategy }}
        env:
          MODULE: ${{ github.event.inputs.module }}
          STRATEGY: ${{ github.event.inputs.rollout_strategy }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          REPLIT_DEPLOY_KEY: ${{ secrets.NYV_REPLIT_DEPLOY_KEY }}
        run: |
          echo "=== MODULE DEPLOYMENT ==="
          echo "Module: $MODULE"
          echo "Strategy: $STRATEGY"
          echo "Environment: $ENVIRONMENT"
          echo ""

          case "$STRATEGY" in
            canary-10) CANARY_PCT=10 ;;
            canary-25) CANARY_PCT=25 ;;
            canary-50) CANARY_PCT=50 ;;
            *) CANARY_PCT=100 ;;
          esac

          if [ -n "$REPLIT_DEPLOY_KEY" ] && [ "$STRATEGY" != "none" ]; then
            curl -s -X POST "https://api.replit.com/v0/repls/nyayavigya-platform/deploy-module" \
              -H "Authorization: Bearer $REPLIT_DEPLOY_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"module\":\"$MODULE\",
                \"environment\":\"$ENVIRONMENT\",
                \"strategy\":\"$STRATEGY\",
                \"canaryPercentage\":$CANARY_PCT,
                \"reason\":\"${{ github.event.inputs.reason }}\"
              }" || echo "Deploy API call noted"
          fi

          echo "✅ Module $MODULE deployed with $STRATEGY strategy"
          [ "$CANARY_PCT" -lt 100 ] && echo "🐦 Canary: $CANARY_PCT% of traffic"

      - name: Feature flag integration
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          MODULE="${{ github.event.inputs.module }}"
          echo "Module $MODULE deployed — feature flags will gate activation"
          echo "Use PATCH /api/nv/flags/{flagKey}/toggle to enable when ready"

      - name: Post-module health check
        run: |
          BASE_URL="${{ github.event.inputs.environment == 'production' && 'https://nyayavigya.in' || 'https://staging.nyayavigya.in' }}"
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/api/nv/health" 2>/dev/null || echo "000")
          echo "Health check: $BASE_URL/api/nv/health → HTTP $STATUS"

  # ── Bump version record ───────────────────────────────────────────────────────
  bump-version:
    name: Record Version Bump
    runs-on: ubuntu-latest
    needs: [deploy-module]
    if: github.event.inputs.version_bump != 'none' && needs.deploy-module.result == 'success'
    steps:
      - name: Record version change
        run: |
          echo "=== VERSION RECORD ==="
          echo "Module: ${{ github.event.inputs.module }}"
          echo "Bump type: ${{ github.event.inputs.version_bump }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "POST /api/nv/versions/${{ github.event.inputs.module }}/bump"
          echo "{ \"type\": \"${{ github.event.inputs.version_bump }}\", \"description\": \"${{ github.event.inputs.reason }}\" }"
