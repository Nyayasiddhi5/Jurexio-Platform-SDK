name: NYV CI — PR Validation

on:
  pull_request:
    branches: [main, staging, release/*]
    paths-ignore:
      - '**.md'
      - '.github/CODEOWNERS'
      - 'docs/**'

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  WORKING_DIR: nyayavigya-platform-312

jobs:
  # ── JOB 1: Type Check ───────────────────────────────────────────────────────
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --prefer-offline

      - name: TypeScript check (server)
        working-directory: ${{ env.WORKING_DIR }}
        run: npx tsc --noEmit

      - name: TypeScript check (client)
        working-directory: ${{ env.WORKING_DIR }}
        run: npx tsc --noEmit --project tsconfig.client.json || true

  # ── JOB 2: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --prefer-offline

      - name: Run ESLint
        working-directory: ${{ env.WORKING_DIR }}
        run: npx eslint src/ --ext .ts,.tsx --max-warnings 0 || true

  # ── JOB 3: Security Scan ───────────────────────────────────────────────────
  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit
        working-directory: ${{ env.WORKING_DIR }}
        run: npm audit --audit-level=high || true

  # ── JOB 4: Module Build Test ────────────────────────────────────────────────
  build-test:
    name: Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [type-check, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --prefer-offline

      - name: Build frontend (Vite)
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NODE_ENV: production
        run: npx vite build --mode production 2>&1 | tail -50

      - name: Verify dist output
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          test -d dist && echo "✅ dist/ exists" || (echo "❌ dist/ missing" && exit 1)
          test -f dist/index.html && echo "✅ index.html built" || echo "⚠️ index.html not found"

  # ── JOB 5: Module Compatibility Check ──────────────────────────────────────
  module-compat:
    name: Module Version Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --prefer-offline

      - name: Check module compatibility
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "Checking module dependencies..."
          node -e "
          import('./src/services/nyv-deployment-version-manager.js')
            .then(m => {
              const vm = m.versionManager;
              const mods = vm.getAllModules();
              console.log('Modules registered:', mods.length);
              mods.forEach(m => console.log(' -', m.moduleId + '@' + m.versionString));
            })
            .catch(e => console.log('Module check skipped (pre-build):', e.message));
          " 2>/dev/null || echo "Module compat check: OK (skipped pre-build)"

  # ── JOB 6: API Contract Test ────────────────────────────────────────────────
  api-contract:
    name: API Contract Validation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --prefer-offline

      - name: Validate route prefix compliance
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "Checking for legacy /api/nyv/ route prefix..."
          if grep -r "router.use('/api/nyv/" src/ --include="*.ts" 2>/dev/null | grep -v "node_modules"; then
            echo "❌ Found legacy /api/nyv/ route prefix — use /api/nv/ instead"
            exit 1
          fi
          echo "✅ All routes use /api/nv/ prefix"

      - name: Flat agent registry freshness (NV-AGENT-REGISTRY-FRESH-001)
        working-directory: ${{ env.WORKING_DIR }}
        run: bash scripts/nv-check-flat-registry.sh

      - name: Validate architectural invariants
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "Checking StoragePathBuilder usage..."
          if grep -r "hardcoded.*path\|/storage/\|/uploads/" src/ --include="*.ts" 2>/dev/null | grep -v "StoragePathBuilder\|node_modules" | grep -q "org_id"; then
            echo "⚠️ Potentially hardcoded storage path found — use StoragePathBuilder.resolve()"
          fi
          echo "✅ Architectural invariant check passed"

  # ── JOB 7: Unit Tests + Coverage ───────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Vitest + Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [type-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --prefer-offline

      - name: Run unit tests
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NODE_ENV: test
          DATABASE_URL: ''
          NYV_JWT_SECRET: test-jwt-secret-for-ci-only
        run: npx vitest run --reporter=verbose 2>&1 | tail -100 || true

      - name: Generate coverage report
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NODE_ENV: test
          DATABASE_URL: ''
          NYV_JWT_SECRET: test-jwt-secret-for-ci-only
        run: npx vitest run --coverage 2>&1 | tail -50 || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ${{ env.WORKING_DIR }}/coverage
          flags: unittests
          fail_ci_if_error: false

  # ── JOB 8: SAST Security Scan ───────────────────────────────────────────────
  sast-scan:
    name: SAST + Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect hardcoded secrets
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "=== Checking for hardcoded secrets ==="
          FOUND=0

          # Check for common secret patterns
          if grep -rn "password\s*=\s*['\"][^'\"]\+['\"]" src/ --include="*.ts" | grep -v "process.env\|env\." | grep -v "//\|^\s*\*" | grep -v "test\|spec" | grep -v "NVDemo" ; then
            echo "⚠️ Possible hardcoded passwords detected"
          fi

          if grep -rn "secret\s*=\s*['\"][^'\"]\{8,\}['\"]" src/ --include="*.ts" | grep -v "process.env\|env\." | grep -v "//\|^\s*\*" ; then
            echo "⚠️ Possible hardcoded secrets detected"
            FOUND=1
          fi

          if grep -rn "apiKey\s*=\s*['\"]sk-[^'\"]\+['\"]" src/ --include="*.ts" | grep -v "process.env" ; then
            echo "❌ OpenAI API key hardcoded! Remove immediately."
            FOUND=1
          fi

          if [ $FOUND -eq 0 ]; then
            echo "✅ No hardcoded secrets detected"
          fi

      - name: Check for SQL injection patterns
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "=== Checking for raw SQL injection risks ==="
          if grep -rn "\${req\." src/ --include="*.ts" | grep "sql\`\|query\(" | grep -v "sql\`\|drizzle\|execute(sql" ; then
            echo "⚠️ Possible SQL injection vector — use parameterized queries"
          else
            echo "✅ No direct SQL injection patterns found"
          fi

      - name: Check console.log density (code quality)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          CONSOLE_COUNT=$(grep -rn "console\.log\|console\.error\|console\.warn" src/ --include="*.ts" | wc -l)
          echo "console.* calls remaining: $CONSOLE_COUNT"
          if [ "$CONSOLE_COUNT" -gt 50 ]; then
            echo "⚠️ High console.log density ($CONSOLE_COUNT) — replace with structured logger"
          else
            echo "✅ console.log density acceptable ($CONSOLE_COUNT)"
          fi

  # ── JOB 9: NYV Client SDK Tests ─────────────────────────────────────────────
  sdk-tests:
    name: NYV Client SDK Tests (v3.1.2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [type-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/packages/client-sdk/package-lock.json

      - name: Install SDK dependencies
        working-directory: ${{ env.WORKING_DIR }}/packages/client-sdk
        run: npm ci --prefer-offline

      - name: Build SDK
        working-directory: ${{ env.WORKING_DIR }}/packages/client-sdk
        run: npm run build

      - name: Run SDK unit tests
        working-directory: ${{ env.WORKING_DIR }}/packages/client-sdk
        env:
          NODE_ENV: test
        run: npm test -- --reporter=verbose 2>&1 | tail -60

      - name: Verify SDK dist output
        working-directory: ${{ env.WORKING_DIR }}/packages/client-sdk
        run: |
          test -d dist && echo "✅ SDK dist/ exists" || (echo "❌ SDK dist/ missing" && exit 1)
          test -f dist/index.js && echo "✅ SDK index.js built" || echo "⚠️ SDK index.js not found"
          echo "SDK package version: $(node -p "require('./package.json').version")"

  # ── JOB 10: RAGAS Retrieval Eval (NV-EVAL-RAGAS-001) ────────────────────────
  # Retrieval-quality gate over the platform's OWN live RAG path. The harness is
  # CI-aware: with no DB / unpopulated rag store it prints a SKIP banner and
  # exits 0 (so keyless CI never goes red); when a DB + populated store are
  # present (set NYV_DATABASE_URL secret) it computes real context-precision /
  # context-recall and exits non-zero if a gated metric falls below threshold.
  rag-eval:
    name: RAGAS Retrieval Eval
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [type-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --prefer-offline

      - name: Run RAGAS retrieval eval (skip-safe without DB)
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NODE_ENV: test
          # Provided in repo/org secrets when a seeded eval DB is available.
          NYV_DATABASE_URL: ${{ secrets.NYV_EVAL_DATABASE_URL }}
          NYV_JWT_SECRET: test-jwt-secret-for-ci-only
        run: npm run eval:ragas

      - name: Upload RAGAS scoreboard
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ragas-scoreboard
          path: ${{ env.WORKING_DIR }}/docs/audit/eval/scoreboard-latest.*
          if-no-files-found: ignore

  # ── JOB 11: Neural rerank nDCG soak (NV-RAG-NDCG-001) ───────────────────────
  # Offline nDCG@K over nvLegalRerankerService. Skip-safe without neural keys
  # when NYV_NDCG_REQUIRE_NEURAL=1 (exit 0 + skipped banner). Wire
  # COHERE_API_KEY / VOYAGE_API_KEY / CROSS_ENCODER_URL org secrets to enable
  # the live neural soak; optional NYV_NDCG_MIN_DELTA fails the job on regression.
  rag-ndcg:
    name: Neural Rerank nDCG Soak
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [type-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --prefer-offline

      - name: Run nDCG soak (skip-safe without neural keys)
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NODE_ENV: test
          NYV_NDCG_REQUIRE_NEURAL: '1'
          NYV_NDCG_MIN_DELTA: ${{ vars.NYV_NDCG_MIN_DELTA }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          CROSS_ENCODER_URL: ${{ secrets.CROSS_ENCODER_URL }}
        run: npm run rag:ndcg

  # ── STATUS CHECK ─────────────────────────────────────────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [type-check, lint, security, build-test, api-contract, unit-tests, sast-scan, sdk-tests, rag-eval, rag-ndcg]
    if: always()
    steps:
      - name: Report CI status
        run: |
          echo "CI Pipeline completed"
          echo "type-check: ${{ needs.type-check.result }}"
          echo "lint: ${{ needs.lint.result }}"
          echo "security: ${{ needs.security.result }}"
          echo "build-test: ${{ needs.build-test.result }}"
          echo "api-contract: ${{ needs.api-contract.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "sast-scan: ${{ needs.sast-scan.result }}"
          echo "sdk-tests: ${{ needs.sdk-tests.result }}"
          echo "rag-eval: ${{ needs.rag-eval.result }}"
          echo "rag-ndcg: ${{ needs.rag-ndcg.result }}"
