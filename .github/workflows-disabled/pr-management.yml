name: NYV PR Management

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, review_requested]
  pull_request_review:
    types: [submitted]

env:
  WORKING_DIR: nyayavigya-platform-312

jobs:
  # ── Auto-label PRs based on changed files ─────────────────────────────────────
  auto-label:
    name: Auto-Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Label by changed files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
        continue-on-error: true

      - name: Label by PR title convention
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = context.payload.pull_request.title.toLowerCase();
            const labels = [];
            if (title.startsWith('feat:') || title.startsWith('feature:')) labels.push('feature');
            if (title.startsWith('fix:') || title.startsWith('bugfix:')) labels.push('bug');
            if (title.startsWith('breaking:')) labels.push('breaking-change');
            if (title.startsWith('sec:') || title.startsWith('security:')) labels.push('security');
            if (title.startsWith('perf:')) labels.push('performance');
            if (title.startsWith('docs:')) labels.push('documentation');
            if (title.includes('[india]') || title.includes('[IN]')) labels.push('jurisdiction:IN');
            if (title.includes('[eu]') || title.includes('[EU]')) labels.push('jurisdiction:EU');
            if (title.includes('[us]') || title.includes('[US]')) labels.push('jurisdiction:US');
            if (title.includes('[gcc]') || title.includes('[GCC]')) labels.push('jurisdiction:GCC');
            if (title.includes('[nym]')) labels.push('platform:nyayamitra');
            if (title.includes('[pro]')) labels.push('platform:professional');
            if (title.includes('[gov]')) labels.push('platform:governance');
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels,
              });
              console.log('Labels added:', labels);
            }

  # ── Validate PR description ───────────────────────────────────────────────────
  validate-pr:
    name: Validate PR Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check PR title format
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $TITLE"
          VALID_PREFIXES="feat:|fix:|breaking:|sec:|perf:|docs:|refactor:|test:|chore:|revert:"
          if echo "$TITLE" | grep -qE "^($VALID_PREFIXES)"; then
            echo "✅ PR title follows convention"
          else
            echo "⚠️ PR title should start with: feat: / fix: / breaking: / sec: / perf: / docs: / refactor: / test: / chore:"
          fi

      - name: Check for architectural invariant violations
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "Checking architectural invariants in changed files..."
          # Check for /api/nyv/ route prefix (should be /api/nv/)
          if git diff --name-only HEAD~1 2>/dev/null | xargs grep -l "/api/nyv/" 2>/dev/null | head -5; then
            echo "❌ Found /api/nyv/ prefix — use /api/nv/ instead"
          else
            echo "✅ No legacy route prefix found"
          fi

      - name: Check for hardcoded secrets pattern
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "Checking for hardcoded secret patterns..."
          PATTERNS='(sk-[a-zA-Z0-9]{20}|sk-ant-[a-zA-Z0-9]{40}|AIza[a-zA-Z0-9_-]{35})'
          if git diff HEAD~1 2>/dev/null | grep -qE "$PATTERNS"; then
            echo "❌ Potential hardcoded API key detected — use env vars"
            exit 1
          else
            echo "✅ No hardcoded secrets found"
          fi

  # ── Module impact analysis ────────────────────────────────────────────────────
  module-impact:
    name: Module Impact Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Analyze changed modules
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');

            let changedFiles = [];
            try {
              changedFiles = execSync('git diff --name-only HEAD~1').toString().trim().split('\n');
            } catch(e) {
              console.log('Could not get changed files:', e.message);
              return;
            }

            const MODULE_MAP = {
              'src/routes/nv-model': 'nyv-model-registry',
              'src/config/nyv-dynamic-model': 'nyv-model-registry',
              'src/routes/nv-feature': 'nyv-feature-flags',
              'src/services/nyv-feature-flag': 'nyv-feature-flags',
              'src/routes/nv-tenant': 'nyv-tenant-manager',
              'src/services/nyv-saas-tenant': 'nyv-tenant-manager',
              'src/services/nyv-deployment': 'nyv-deployment-manager',
              'src/services/rag/': 'nyv-rag',
              'src/services/nv-document': 'nyv-documents',
              'src/middleware/nv-auth': 'nyv-auth',
              'src/middleware/nv-sdk': 'nyv-sdk',
              'src/services/ns-lrm': 'nyv-llm-router',
              'src/index.ts': 'nyv-gateway',
              'scripts/nv-migrate': 'nyv-migrations',
              'shared/schema': 'nyv-migrations',
            };

            const affectedModules = new Set();
            for (const file of changedFiles) {
              for (const [pattern, module] of Object.entries(MODULE_MAP)) {
                if (file.includes(pattern)) affectedModules.add(module);
              }
            }

            const moduleList = [...affectedModules].join(', ') || 'None identified';

            const comment = `## 📦 Module Impact Analysis

            **Affected Modules:** ${moduleList}

            **Changed Files:** ${changedFiles.length} files

            <details>
            <summary>Files changed</summary>

            ${changedFiles.map(f => `- \`${f}\``).join('\n')}
            </details>

            ### Deployment Steps
            ${[...affectedModules].map(m => `- [ ] Deploy \`${m}\` via Module Deploy workflow`).join('\n') || 'No specific module deployments identified'}

            ### Feature Flag Verification
            ${[...affectedModules].map(m => `- [ ] Verify feature flags for \`${m}\``).join('\n') || 'N/A'}
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: comment,
            });

  # ── Size check ────────────────────────────────────────────────────────────────
  size-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & build
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          npm ci --prefer-offline
          npx vite build 2>&1 | tail -30 || true

      - name: Check bundle size
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          if [ -d dist ]; then
            TOTAL=$(du -sh dist/ | cut -f1)
            echo "Total bundle size: $TOTAL"
            JS_SIZE=$(find dist -name "*.js" -exec wc -c {} + 2>/dev/null | tail -1 | awk '{print $1}')
            JS_MB=$((JS_SIZE / 1024 / 1024))
            echo "JS bundle: ${JS_MB}MB"
            if [ "$JS_MB" -gt 10 ]; then
              echo "⚠️ JS bundle > 10MB — consider code splitting"
            else
              echo "✅ Bundle size OK"
            fi
          fi
