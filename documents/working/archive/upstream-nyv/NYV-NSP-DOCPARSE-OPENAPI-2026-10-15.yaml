openapi: 3.0.3
info:
  title: Nyayavigya NSP Docparse API (fragment)
  version: 2026-10-15
  description: |
    Partner SDK routes under `/api/nv/v1/sdk/docparse/*`.
    Auth: `X-API-Key` (NSP partner key). NSP-only routes require `X-NYV-Platform: nsp` or `nsp-pro`.
    **There is no `/docparse/partial` route** — use agent-recover (gap) or attach-understand (prompt-only).
    Signed by NYV engineering handoff NYV-01; canonical implementation `src/routes/nv-docparse-sdk-routes.ts`.
servers:
  - url: https://api.nyayasiddhi.online
    description: nysdev / partner dev (same host used for NSP integration today)
  - url: https://api.nyayasiddhi.online
    description: production base URL (confirm with NYV ops before prod cutover)
tags:
  - name: docparse-jobs
  - name: docparse-nsp
paths:
  /api/nv/v1/sdk/docparse/jobs:
    post:
      tags: [docparse-jobs]
      summary: Submit async docparse job
      operationId: docparseSubmitJob
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocparseJobSubmitBody'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DocparseSdkDisabled'
  /api/nv/v1/sdk/docparse/jobs/batch:
    post:
      tags: [docparse-jobs]
      summary: Submit up to 8 batch items (5 docs each)
      operationId: docparseSubmitJobBatch
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batches]
              properties:
                domainPackId: { type: string, example: legal-in-civil }
                batches:
                  type: array
                  maxItems: 8
                  items:
                    $ref: '#/components/schemas/DocparseJobSubmitBody'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      jobIds: { type: array, items: { type: string } }
                      count: { type: integer }
        '503':
          $ref: '#/components/responses/DocparseSdkDisabled'
  /api/nv/v1/sdk/docparse/jobs/{jobId}:
    get:
      tags: [docparse-jobs]
      summary: Poll job status and result
      operationId: docparseGetJob
      security: [{ ApiKey: [] }]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusEnvelope'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/DocparseSdkDisabled'
  /api/nv/v1/sdk/docparse/packs:
    get:
      tags: [docparse-jobs]
      summary: List domain packs
      operationId: docparseListPacks
      security: [{ ApiKey: [] }]
      responses:
        '200':
          description: Pack catalog
        '503':
          $ref: '#/components/responses/DocparseSdkDisabled'
  /api/nv/v1/sdk/docparse/nsp/agent-recover:
    post:
      tags: [docparse-nsp]
      summary: NSP gap recovery — re-OCR + partial LLM on NYV
      operationId: nspAgentRecover
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/NyvPlatformNsp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NspAgentRecoverBody'
      responses:
        '200':
          description: Recovery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NspAgentRecoverEnvelope'
        '403':
          $ref: '#/components/responses/NspPlatformForbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/DocparseSdkDisabled'
  /api/nv/v1/sdk/docparse/nsp/evidence-depict:
    post:
      tags: [docparse-nsp]
      summary: Vision depiction for case photos / imaging
      operationId: nspEvidenceDepict
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/NyvPlatformNsp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NspEvidenceDepictBody'
      responses:
        '200':
          description: Depiction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NspEvidenceDepictEnvelope'
        '403':
          $ref: '#/components/responses/NspPlatformForbidden'
        '503':
          description: Feature disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  code: { type: string, example: DOCPARSE_EVIDENCE_DEPICT_DISABLED }
  /api/nv/v1/sdk/docparse/nsp/attach-understand:
    post:
      tags: [docparse-nsp]
      summary: Prompt-only attach understanding (no re-OCR)
      operationId: nspAttachUnderstand
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/NyvPlatformNsp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NspAttachUnderstandBody'
      responses:
        '200':
          description: Understanding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NspAttachUnderstandEnvelope'
        '403':
          $ref: '#/components/responses/NspPlatformForbidden'
        '503':
          description: Feature disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  code: { type: string, example: DOCPARSE_ATTACH_UNDERSTAND_DISABLED }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    NyvPlatformNsp:
      name: X-NYV-Platform
      in: header
      required: true
      schema:
        type: string
        enum: [nsp, nsp-pro]
  schemas:
    DocparseJobSubmitBody:
      type: object
      properties:
        base64: { type: string, format: byte }
        fileName: { type: string }
        mimeType: { type: string }
        documents:
          type: array
          maxItems: 8
          items:
            type: object
            properties:
              base64: { type: string }
              fileName: { type: string }
              mimeType: { type: string }
        domainPackId: { type: string, example: legal-in-civil }
        forceOcr: { type: boolean }
        preferOcr: { type: boolean }
        maxPagesPerDoc: { type: integer, maximum: 400 }
    NspAgentRecoverBody:
      allOf:
        - $ref: '#/components/schemas/DocparseJobSubmitBody'
        - type: object
          properties:
            jurisdiction: { type: string, default: IN }
            localParse:
              type: object
              properties:
                unparsedPageNos: { type: array, items: { type: integer } }
                humanReviewPageNos: { type: array, items: { type: integer } }
                lowConfidenceFieldPaths: { type: array, items: { type: string } }
                qualityBand: { type: string }
            options:
              type: object
              properties:
                partialLlm: { type: boolean, default: true }
                extractiveSummary: { type: boolean }
                humanReviewPagesOnly: { type: boolean }
    NspEvidenceDepictBody:
      allOf:
        - $ref: '#/components/schemas/DocparseJobSubmitBody'
        - type: object
          properties:
            localVisibleText: { type: string }
            userQuestion: { type: string }
            pageNo: { type: integer }
            jurisdiction: { type: string }
    NspAttachUnderstandBody:
      type: object
      required: [userPrompt]
      properties:
        userPrompt: { type: string }
        prompt: { type: string, description: alias for userPrompt }
        jurisdiction: { type: string }
        matterSummary: { type: string }
        attachContext:
          $ref: '#/components/schemas/NspAttachContext'
    NspAttachContext:
      type: object
      properties:
        visibleText: { type: string }
        visualSummary: { type: string }
        parseQuality: { type: string, enum: [high, medium, low, partial] }
        docTypes: { type: array, items: { type: string } }
        fields: { type: object, additionalProperties: true }
        extractiveSummary: { type: array, items: { type: string } }
        ingestRole: { type: string }
    JobAcceptedEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            jobId: { type: string }
            status: { type: string, example: queued }
            batchId: { type: string }
    JobStatusEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            jobId: { type: string }
            status: { type: string, enum: [queued, running, done, failed, cancelled] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            progress:
              type: object
              properties:
                pageNo: { type: integer }
                pageTotal: { type: integer }
                documentId: { type: string }
            error: { type: string }
            result: { type: object, description: Full docparse result when status=done }
    NspAgentRecoverEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            mode: { type: string, example: nsp-agent-recover }
            partialRecoveryApplied: { type: boolean }
            caseCreate: { type: object }
            companyProfile: { type: object }
            userProfile: { $ref: '#/components/schemas/NspUserOnboardingPayload' }
            evidence: { $ref: '#/components/schemas/NspEvidencePayload' }
            extractiveSummary: { type: array, items: { type: string } }
            docparseIntelligence: { type: object }
            extraction: { type: object }
    NspEvidenceDepictEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            mode: { type: string, example: nsp-evidence-depict }
            contentSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
            promptVersion: { type: string, example: evidence-depict-v1 }
            depiction:
              type: object
              properties:
                text: { type: string }
                limitations: { type: string }
                suggestedTags: { type: array, items: { type: string } }
                piiFlags: { type: array, items: { type: string } }
                visibleText: { type: string }
            model: { type: string }
    NspAttachUnderstandEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: '#/components/schemas/NspAttachUnderstandResponse'
    NspAttachUnderstandResponse:
      type: object
      properties:
        mode: { type: string, example: nsp-attach-understand }
        understanding: { type: string }
        limitations: { type: string }
        suggestedFields: { type: object, additionalProperties: { type: string } }
        followUpQuestions: { type: array, items: { type: string } }
        promptVersion: { type: string, example: attach-understand-v1 }
        model: { type: string }
    NspUserOnboardingPayload:
      $ref: './NYV-NSP-DOCPARSE-SCHEMAS-2026-10-15.json#/definitions/NspUserOnboardingPayload'
    NspEvidencePayload:
      $ref: './NYV-NSP-DOCPARSE-SCHEMAS-2026-10-15.json#/definitions/NspEvidencePayload'
    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        code: { type: string }
  responses:
    BadRequest:
      description: Missing base64/documents
    Unprocessable:
      description: Recover/depict/understand failed (sanitized)
    DocparseSdkDisabled:
      description: NYV_F_DOCPARSE_SDK=0
    NspPlatformForbidden:
      description: Missing X-NYV-Platform nsp
