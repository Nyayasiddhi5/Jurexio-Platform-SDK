---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nyayavigya-ingress
  namespace: nyayavigya
  labels:
    app.kubernetes.io/name: nyayavigya
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://console.nyayavigya.in,https://app.nyayavigya.in"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-NV-Api-Key,X-NV-Platform,X-Org-Id"
    # WebSocket support
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_cache_bypass $http_upgrade;
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Security headers
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.nyayavigya.in wss://api.nyayavigya.in;" always;
spec:
  tls:
    - hosts:
        - api.nyayavigya.in
        - console.nyayavigya.in
        - "*.nyayavigya.in"
      secretName: nyayavigya-tls-cert
  rules:
    # API Gateway — all /api/nv routes
    - host: api.nyayavigya.in
      http:
        paths:
          - path: /api/nv
            pathType: Prefix
            backend:
              service:
                name: nyayavigya-gateway-svc
                port:
                  number: 80
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: nyayavigya-gateway-svc
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: nyayavigya-gateway-svc
                port:
                  number: 80
    # Console UI
    - host: console.nyayavigya.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nyayavigya-console-svc
                port:
                  number: 80
