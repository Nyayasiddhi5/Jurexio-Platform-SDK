---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyayavigya-gateway
  namespace: nyayavigya
  labels:
    app: nyayavigya-gateway
    app.kubernetes.io/name: nyayavigya-gateway
    app.kubernetes.io/version: "3.1.2"
    app.kubernetes.io/component: gateway
    tier: backend
  annotations:
    deployment.kubernetes.io/revision: "1"
    nyayavigya.io/platform-version: "3.1.2"
    nyayavigya.io/sdk-version: "5.0.0"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: nyayavigya-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nyayavigya-gateway
        version: "3.1.2"
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/api/nv/health/metrics"
    spec:
      serviceAccountName: nyayavigya-gateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 60
      containers:
        - name: gateway
          image: nyayavigya/gateway:3.1.2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nyayavigya-config
            - secretRef:
                name: nyayavigya-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /api/nv/health/live
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/nv/health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /api/nv/health/live
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-storage
              mountPath: /tmp
            - name: logs-storage
              mountPath: /app/logs
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: tmp-storage
          emptyDir:
            sizeLimit: 500Mi
        - name: logs-storage
          emptyDir:
            sizeLimit: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - nyayavigya-gateway
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: nyayavigya-gateway
