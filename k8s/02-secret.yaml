---
# IMPORTANT: Replace all <BASE64_ENCODED_*> values before deploying.
# Generate with: echo -n "YOUR_SECRET_VALUE" | base64
# Store in HashiCorp Vault or AWS Secrets Manager in production.
# NEVER commit actual secrets to version control.
apiVersion: v1
kind: Secret
metadata:
  name: nyayavigya-secrets
  namespace: nyayavigya
  labels:
    app.kubernetes.io/name: nyayavigya
    app.kubernetes.io/component: secrets
  annotations:
    secret-rotation-days: "90"
    last-rotated: "2026-04-03"
type: Opaque
data:
  # Database
  DATABASE_URL: <BASE64_ENCODED_NEON_POSTGRES_CONNECTION_STRING>
  # JWT Secrets
  NYV_JWT_SECRET: <BASE64_ENCODED_JWT_SECRET_MIN_64_CHARS>
  NYV_JWT_REFRESH_SECRET: <BASE64_ENCODED_JWT_REFRESH_SECRET_MIN_64_CHARS>
  # LLM API Keys
  OPENROUTER_API_KEY: <BASE64_ENCODED_OPENROUTER_API_KEY>
  OPENAI_API_KEY: <BASE64_ENCODED_OPENAI_API_KEY>
  ANTHROPIC_API_KEY: <BASE64_ENCODED_ANTHROPIC_API_KEY>
  GOOGLE_GENERATIVE_AI_API_KEY: <BASE64_ENCODED_GOOGLE_API_KEY>
  GROQ_API_KEY: <BASE64_ENCODED_GROQ_API_KEY>
  MISTRAL_API_KEY: <BASE64_ENCODED_MISTRAL_API_KEY>
  DEEPSEEK_API_KEY: <BASE64_ENCODED_DEEPSEEK_API_KEY>
  COHERE_API_KEY: <BASE64_ENCODED_COHERE_API_KEY>
  PERPLEXITY_API_KEY: <BASE64_ENCODED_PERPLEXITY_API_KEY>
  # India-First APIs
  SARVAM_API_KEY: <BASE64_ENCODED_SARVAM_API_KEY>
  WHATSAPP_TOKEN: <BASE64_ENCODED_WHATSAPP_BUSINESS_TOKEN>
  WHATSAPP_PHONE_ID: <BASE64_ENCODED_WHATSAPP_PHONE_NUMBER_ID>
  # Payments
  RAZORPAY_KEY_ID: <BASE64_ENCODED_RAZORPAY_KEY_ID>
  RAZORPAY_KEY_SECRET: <BASE64_ENCODED_RAZORPAY_KEY_SECRET>
  # Email
  SMTP_HOST: <BASE64_ENCODED_SMTP_HOST>
  SMTP_USER: <BASE64_ENCODED_SMTP_USER>
  SMTP_PASS: <BASE64_ENCODED_SMTP_PASSWORD>
  # Redis (for multi-pod shared cache)
  REDIS_URL: <BASE64_ENCODED_REDIS_TLS_CONNECTION_URL>
  # AWS S3 (for document storage)
  AWS_ACCESS_KEY_ID: <BASE64_ENCODED_AWS_ACCESS_KEY_ID>
  AWS_SECRET_ACCESS_KEY: <BASE64_ENCODED_AWS_SECRET_ACCESS_KEY>
  AWS_S3_BUCKET: <BASE64_ENCODED_S3_BUCKET_NAME>
  AWS_REGION: <BASE64_ENCODED_AWS_REGION>
  # Monitoring
  DATADOG_API_KEY: <BASE64_ENCODED_DATADOG_API_KEY>
  SENTRY_DSN: <BASE64_ENCODED_SENTRY_DSN>
