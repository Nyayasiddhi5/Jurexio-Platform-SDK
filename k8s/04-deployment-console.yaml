---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyayavigya-console
  namespace: nyayavigya
  labels:
    app: nyayavigya-console
    app.kubernetes.io/name: nyayavigya-console
    app.kubernetes.io/version: "3.1.2"
    app.kubernetes.io/component: console
    tier: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: nyayavigya-console
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nyayavigya-console
        version: "3.1.2"
        tier: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      terminationGracePeriodSeconds: 30
      containers:
        - name: console
          image: nyayavigya/console:3.1.2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3004
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nyayavigya-config
          env:
            - name: VITE_API_BASE
              value: "https://api.nyayavigya.in"
            - name: VITE_WS_URL
              value: "wss://api.nyayavigya.in"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
