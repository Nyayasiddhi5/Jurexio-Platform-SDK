---
# NetworkPolicy — Zero-trust pod networking for Nyayavigya 3.1.2
# Enforces: gateway ↔ console ↔ DB only; deny all other ingress/egress by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nyayavigya-gateway-netpol
  namespace: nyayavigya
  labels:
    app: nyayavigya-gateway
    app.kubernetes.io/name: nyayavigya
    app.kubernetes.io/component: network-policy
  annotations:
    description: "Zero-trust network policy for Nyayavigya Gateway — deny all, allow specific"
spec:
  podSelector:
    matchLabels:
      app: nyayavigya-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from NGINX ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5000
    # Allow from console (internal API calls)
    - from:
        - podSelector:
            matchLabels:
              app: nyayavigya-console
      ports:
        - protocol: TCP
          port: 5000
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 5000
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS to external APIs (eCourts, OpenRouter, Upstash, Neon DB, etc.)
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # Allow PostgreSQL (Neon DB)
    - to: []
      ports:
        - protocol: TCP
          port: 5432
    # Allow Redis (Upstash TCP rediss://)
    - to: []
      ports:
        - protocol: TCP
          port: 6380
        - protocol: TCP
          port: 6379
    # Allow inter-pod communication with console
    - to:
        - podSelector:
            matchLabels:
              app: nyayavigya-console
      ports:
        - protocol: TCP
          port: 80

---
# NetworkPolicy — Console
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nyayavigya-console-netpol
  namespace: nyayavigya
  labels:
    app: nyayavigya-console
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: nyayavigya-console
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from NGINX ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 80
  egress:
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
    # Gateway API calls
    - to:
        - podSelector:
            matchLabels:
              app: nyayavigya-gateway
      ports:
        - protocol: TCP
          port: 5000
    # CDN / external assets
    - to: []
      ports:
        - protocol: TCP
          port: 443

---
# NetworkPolicy — Default deny-all for namespace (hardening baseline)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: nyayavigya
  labels:
    app.kubernetes.io/name: nyayavigya
    app.kubernetes.io/component: network-policy-baseline
  annotations:
    description: "Deny all ingress and egress by default — explicit policies override"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
